<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .check {
            font-size: 60px;
            color: #2ecc71;
        }

        h1 {
            margin: 10px 0;
        }

        .info {
            margin: 20px 0;
            font-size: 14px;
            color: #555;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }

        .btn:hover {
            background: #27ae60;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="check">✔</div>

    <h1>Payment Successful!</h1>

    <p>Your smoothie order has been confirmed.</p>

    <div class="info">
        <p><strong>Order ID:</strong> {{ order_id }}</p>
        <p><strong>Reference:</strong> {{ reference }}</p>
    </div>

    <a href="/" class="btn">Back to Home</a>
    <a href="/receipt/{{ order_id }}"
   class="btn-primary">

   Download Receipt

</a>
</div>


</body>
</html>
