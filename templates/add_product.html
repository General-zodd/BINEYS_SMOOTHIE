<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="order-container">

    <h1>Add Smoothie</h1>

    <form
        method="POST"
        enctype="multipart/form-data"
        class="order-form"
    >

        <input
            type="text"
            name="name"
            placeholder="Smoothie Name"
            required
        >

        <input
            type="text"
            name="description"
            placeholder="Description"
            required
        >

        <input
            type="number"
            name="price"
            placeholder="Price"
            required
        >

        <input
            type="number"
            name="stock"
            placeholder="Stock"
            required
        >

        <input
            type="file"
            name="image"
            required
        >

        <button type="submit">
            Add Product
        </button>

    </form>

</div>

</body>
</html>
