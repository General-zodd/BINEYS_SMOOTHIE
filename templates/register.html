<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Register | Bineys Smoothies
    </title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p>
            Join Bineys Smoothies today
        </p>

        <form
        method="POST"
        class="auth-form">

            <input
            type="text"
            name="fullname"
            placeholder="Full Name"
            required>

            <input
            type="email"
            name="email"
            placeholder="Email"
            required>

            <input
            type="text"
            name="phone"
            placeholder="Phone Number"
            required>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

            <button type="submit">
                Register
            </button>

        </form>

        <div class="auth-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
