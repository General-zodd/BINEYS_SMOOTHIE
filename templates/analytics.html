<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bineys Smoothies - Analytics</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            background:#f4f7fb;
            font-family:Arial, sans-serif;
        }

        .analytics-container{
            width:90%;
            max-width:1100px;
            margin:40px auto;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        .top-bar h1{
            color:#27ae60;
            font-size:36px;
        }

        .back-btn{
            background:#27ae60;
            color:white;
            padding:12px 20px;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
        }

        .stats-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:40px;
        }

        .stat-card{
            background:white;
            padding:25px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .stat-card:hover{
            transform:translateY(-5px);
        }

        .stat-card h3{
            color:#777;
            margin-bottom:10px;
            font-size:18px;
        }

        .stat-card p{
            font-size:32px;
            color:#27ae60;
            font-weight:bold;
        }

        .chart-box{
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
            text-align:center;
        }

        .chart-box h2{
            margin-bottom:20px;
            color:#333;
        }

        .chart-box img{
            width:100%;
            border-radius:15px;
        }

        @media(max-width:768px){

            .top-bar{
                flex-direction:column;
                gap:15px;
            }

            .top-bar h1{
                font-size:28px;
            }

        }

    </style>

</head>
<body>

    <div class="analytics-container">

        <div class="top-bar">
            <h1>📊 Bineys Analytics Dashboard</h1>

            <a href="/admin" class="back-btn">
                ← Back Dashboard
            </a>
        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <h3>Total Orders</h3>
                <p>{{ total_orders }}</p>
            </div>

            <div class="stat-card">
                <h3>Total Revenue</h3>
                <p>GH₵ {{ revenue }}</p>
            </div>

            <div class="stat-card">
                <h3>Products</h3>
                <p>{{ products }}</p>
            </div>

            <div class="stat-card">
                <h3>Customers</h3>
                <p>{{ customers }}</p>
            </div>

        </div>

        <div class="chart-box">

            <h2>Sales Performance</h2>

            <img src="/{{ chart }}" alt="Analytics Chart">

        </div>

    </div>

</body>
</html>
