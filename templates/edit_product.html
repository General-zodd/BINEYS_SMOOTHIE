<h2>Edit Product</h2>

<form method="POST">
    <input name="name" value="{{ product[1] }}"><br>
    <input name="category" value="{{ product[2] }}"><br>
    <input name="price" value="{{ product[3] }}"><br>
    <input name="description" value="{{ product[4] }}"><br>
    <input name="image" value="{{ product[5] }}"><br>

    <button type="submit">Update</button>
</form>
