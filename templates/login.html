<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Login | Bineys Smoothies
    </title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue ordering smoothies
        </p>

        <form
        method="POST"
        class="auth-form">

            <input
            type="email"
            name="email"
            placeholder="Email Address"
            required>

            <input
            type="password"
            name="password"
            placeholder="Password"
            required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="auth-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

    </div>

</div>

</body>
</html>
